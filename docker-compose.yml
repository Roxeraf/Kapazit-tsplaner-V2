services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kapazitaetsplaner
      POSTGRES_USER: kapazitaetsplaner
      POSTGRES_PASSWORD: kapazitaetsplaner
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://kapazitaetsplaner:kapazitaetsplaner@db:5432/kapazitaetsplaner
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
