services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kapazitaetsplaner
      POSTGRES_USER: kapazitaetsplaner
      POSTGRES_PASSWORD: kapazitaetsplaner
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapazitaetsplaner -d kapazitaetsplaner"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://kapazitaetsplaner:kapazitaetsplaner@db:5432/kapazitaetsplaner
      # Jira-Ist-Integration (CONCEPT.md Abschnitt 4) — optional, aus Host-Umgebung
      # durchgereicht; ohne gesetzte Werte bleibt der Sync deaktiviert.
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      # Optional, nur bei Tempo-Timesheets-Nutzung (siehe backend/.env.example).
      TEMPO_API_TOKEN: ${TEMPO_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
