server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: alle client-seitigen Routen (z.B. /projekte/1/uebersicht) existieren nur
    # als React-Router-Pfade, nicht als echte Dateien - ohne diesen Fallback gibt nginx beim
    # Direktaufruf/Reload einer Unterseite fälschlich 404 statt index.html auszuliefern.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
